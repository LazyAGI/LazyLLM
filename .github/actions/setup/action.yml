name: 'Test env setup'
description: 'Composite Action of setting up test environment'
inputs:
  tests_dir:
    description: 'tests directory'
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
      env:
        PYTHON_VERSION: "3.10.9"

    - name: Install ripgrep for basic tests
      if: inputs.tests_dir == 'tests/basic_tests'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y ripgrep
            ;;
          macOS)
            brew install ripgrep
            ;;
          Windows)
            choco install ripgrep --yes --no-progress
            ;;
        esac
        rg --version

    - name: Install Pandoc for basic tests
      if: inputs.tests_dir == 'tests/basic_tests'
      uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      with:
        pandoc-version: '3.11'

    - name: Build project
      shell: bash
      run: |
        python -m pip install 'setuptools<82' build
        cp pyproject.toml ./lazyllm
        python -m build --config-setting=skbuild.wheel.cmake=false

    - name: Install the built package
      shell: bash
      run: |
        ls dist && pip install dist/lazyllm*.whl
        lazyllm install rag
        lazyllm install rag-advanced
        lazyllm install test

    - name: Restore pytest cache
      if: inputs.tests_dir != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.tests_dir }}/.pytest_cache
        key: ${{ github.job }}-${{ github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.sha || github.sha }}
